<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>Skill Tetris</title>
  <style>
    :root{--bg:#f5f0ff;--panel:#fff;--line:#e8ddf5;--text:#4a3b5c;--muted:#9b8eab;--cyan:#7dd3f7;--pink:#f78da7;--lime:#8ed8a8;--amber:#ffc86e}
    *{box-sizing:border-box}html,body{width:100%;min-height:100%;overflow:hidden}body{margin:0;background:var(--bg);color:var(--text);font:14px "PingFang SC","Microsoft YaHei",system-ui,sans-serif;position:fixed;inset:0;touch-action:none;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
    .app{max-width:700px;margin:auto;height:100%;padding:5px 5px 6px;display:flex;flex-direction:column;gap:4px;overflow:hidden}
    header{display:flex;justify-content:space-between;align-items:center;height:26px;gap:8px;margin:0}
    h1{font-size:18px;margin:0;color:#8b5cf6;font-weight:900;letter-spacing:-.02em}
    .eyebrow{display:none}
    .status{font-size:9px;color:var(--muted);padding:2px 6px;border:1px solid #e8ddf5;border-radius:6px;background:var(--panel)}
    .online{display:grid;grid-template-columns:auto 1fr auto auto auto;gap:3px;padding:4px;border:1px solid #e8ddf5;border-radius:10px;background:var(--panel);margin:0;align-items:center;box-shadow:0 2px 8px #e8ddf544}
    .online input,.online button{min-height:30px;height:30px;border:1px solid #e0d5f0;border-radius:8px;background:#faf8ff;color:var(--text);padding:3px 7px;font-size:11px;font-weight:700}
    .online input{width:auto;min-width:0;text-transform:uppercase;text-align:center}
    .online .primary{background:#8b5cf6;border-color:#7c3aed;color:#fff;font-weight:800;box-shadow:0 2px 0 #6d28d9}
    .online-status{grid-column:1/-1;font-size:8px;color:var(--muted);min-height:13px;line-height:13px}
    .arena{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:minmax(0,1fr) auto;gap:4px;overflow:hidden}
    .player{background:var(--panel);border:1px solid #e8ddf5;border-radius:10px;padding:4px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 2px 8px #e8ddf533}
    .player:nth-child(1){border-top:3px solid #7dd3f7}
    .player:nth-child(2){border-top:3px solid #f78da7}
    .player-head{display:flex;justify-content:space-between;margin-bottom:2px;font-size:10px}
    .player-head strong{font-size:10px}
    .player:nth-child(1) .player-head strong{color:#3aa8d2}
    .player:nth-child(2) .player-head strong{color:#e8709a}
    .player-head span{font-size:9px;color:var(--muted)}
    .board{display:grid;grid-template-columns:repeat(10,1fr);width:100%;aspect-ratio:1/1.85;border:2px solid #d9e2f0;border-radius:6px;background:#fafdff;gap:1px;padding:2px;margin:0 auto;box-shadow:inset 0 0 0 1px #fff}
    .cell{display:flex;align-items:center;justify-content:center;background:#fff;border-radius:3px;font-size:clamp(7px,2.4vw,12px);line-height:1;overflow:hidden}
    .cell.filled{box-shadow:inset 0 -2px #0000000d}
    .cyan{background:#e0f5ff}.yellow{background:#fffbe0}.purple{background:#f3e8ff}.orange{background:#fff0e0}.blue{background:#e4eeff}.green{background:#e6f9ee}.red{background:#ffe8ee}.garbage{background:#ececf2}
    .cell.forbidden{box-shadow:inset 0 0 0 2px #f78da788,inset 0 0 8px #f78da733}
    .meter{margin-top:3px}.meter-line{display:flex;justify-content:space-between;color:var(--muted);font-size:8px;line-height:11px}.meter-bar{height:5px;border-radius:4px;overflow:hidden;background:#f0ecf8;border:1px solid #e8ddf5}.meter-fill{height:100%;background:linear-gradient(90deg,#a78bfa,#8b5cf6);border-radius:4px}
    .controls{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;margin-top:3px}
    .controls button{min-height:36px;height:36px;background:#fff;border:1px solid #e0d5f0;border-radius:8px;color:#5a4b6e;font-size:17px;font-weight:900;touch-action:none;box-shadow:0 2px 0 #e8ddf5}
    .controls button:active{transform:translateY(1px);box-shadow:0 1px 0 #e8ddf5}
    .controls .wide{grid-column:span 4;min-height:22px;height:22px;font-size:10px;background:#f78da7;border-color:#f06292;color:#fff;box-shadow:0 2px 0 #e91e63}
    .controls button[data-action="rotate"]{color:#e29238;border-color:#ffe0b2}
    .controls button[data-action="drop"]{color:#3c9c73;border-color:#b5e8cc}
    .skills{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3px;margin-top:3px}
    .skill{min-height:30px;height:30px;background:#fff;border:1px solid #e0d5f0;border-radius:8px;font-size:8px;font-weight:700;color:#5a4b6e;padding:2px 4px;text-align:left;box-shadow:0 2px 0 #e8ddf5;overflow:hidden;line-height:11px;touch-action:manipulation}
    .skill small{display:block;color:var(--muted);font-size:7px;line-height:9px}
    .skill:disabled{opacity:.35}
    .skill.insufficient{opacity:.55;border-style:dashed}
    .draw-skill{background:#fef9e7;border-color:#f9e79f;color:#b7950b;font-weight:700;min-height:30px;height:30px;font-size:8px;border-radius:8px;padding:2px 4px;text-align:left;box-shadow:0 2px 0 #f0da8a;overflow:hidden;line-height:11px}
    .draw-skill small{display:block;color:#c9a51a;font-size:7px;line-height:9px}
    .skill-slots{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3px}
    .skill-slot-empty,.skill-card-back{height:30px;border:1px dashed #e0d5f0;border-radius:8px;background:#faf8ff;color:#c4b5d8;font-size:8px;display:flex;align-items:center;justify-content:center}
    .skill-card-back{border-style:solid;text-align:center}
    .skill::after{position:absolute;right:3px;top:3px;padding:1px 3px;border-radius:3px;font-size:6px;line-height:9px;font-weight:900}
    .skill[data-skill="jam"]::after,.skill[data-skill="reverse"]::after,.skill[data-skill="swapShape"]::after,.skill[data-skill="slam"]::after,.skill[data-skill="zone"]::after,.skill[data-skill="intercept"]::after,.skill[data-skill="offset"]::after,.skill[data-skill="mirrorBoard"]::after,.skill[data-skill="gravity"]::after,.skill[data-skill="drain"]::after{content:'攻击';background:#fde8e8;color:#e74c6f}
    .skill[data-skill="cleanse"]::after,.skill[data-skill="reshape"]::after,.skill[data-skill="reflect"]::after,.skill[data-skill="clearTop"]::after,.skill[data-skill="copyBoard"]::after,.skill[data-skill="store"]::after,.skill[data-skill="predict"]::after{content:'防御';background:#e6f5f0;color:#3aa88a}
    .skill[data-skill="unlockHardDrop"]::after{content:'解锁';background:#fef9e7;color:#c9a51a}
    .center{grid-column:1/-1;min-height:0;height:30px;display:grid;grid-template-columns:1fr 1fr;gap:4px;overflow:hidden}
    .center-panel{min-width:0;padding:3px 5px;border-radius:8px;background:var(--panel);border:1px solid #e8ddf5;overflow:hidden}
    .center-panel h2{display:none}
    .log{height:22px;font-size:7px;line-height:11px;color:var(--muted);overflow:hidden}
    .log p{margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .log p:first-child{color:#6b3f6a;font-weight:700}
    .room-presence{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:4px;min-height:20px;padding:2px 7px;border:1px solid #e8ddf5;border-radius:8px;background:#faf8ff;color:#7a6b8e;font-size:9px;font-weight:700}
    .room-presence .room-phase{color:#8b5cf6}
    .room-presence .room-players{color:#9b8eab;font-weight:600}
    .action-feedback{grid-column:1/-1;min-height:15px;padding:2px 7px;border-radius:6px;background:#faf8ff;border:1px solid #e8ddf5;color:#9b8eab;font-size:8px;line-height:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .action-feedback.success{color:#3aa88a;border-color:#8ed8a8;background:#e6f9ee}
    .action-feedback.warn{color:#c9a51a;border-color:#f9e79f;background:#fef9e7}
    .action-feedback.error{color:#e74c6f;border-color:#f78da7;background:#fde8e8}
    .lobby-overlay{position:fixed;inset:0;z-index:15;display:grid;place-items:center;padding:20px;background:#f5f0ffe8;pointer-events:none}
    .lobby-overlay[hidden]{display:none!important}
    .lobby-card{width:min(92vw,430px);padding:24px 20px;border:1px solid #e0d5f0;border-radius:16px;background:#fff;box-shadow:0 12px 40px #8b5cf61a;text-align:center}
    .lobby-card h2{color:#8b5cf6;margin:0 0 8px;font-size:20px}
    .lobby-card p{color:#9b8eab;margin:0;line-height:1.5}
    .app.game-hidden .arena{visibility:hidden}
    .countdown-modal{display:none;place-items:center;flex-direction:column;gap:10px;z-index:100;pointer-events:none}
    .countdown-modal.visible{display:flex}
    .countdown-modal .countdown-label{font-size:16px;color:#9b8eab}
    .countdown-modal .countdown-value{font-size:88px;line-height:1;color:#8b5cf6;font-weight:900}
    .countdown-modal .countdown-value.go{color:#8ed8a8}
    .room-toast{position:fixed;top:74px;left:50%;z-index:80;max-width:min(88vw,420px);padding:10px 16px;border:1px solid #c4b5fd;border-radius:12px;background:#fff;color:#5a4b6e;font-size:14px;font-weight:800;text-align:center;box-shadow:0 8px 30px #8b5cf622;opacity:0;pointer-events:none;transform:translate(-50%,-12px) scale(.96)}
    .room-toast.show{animation:room-toast-pop 1800ms ease forwards}
    @keyframes room-toast-pop{0%{opacity:0;transform:translate(-50%,-12px) scale(.96)}12%,78%{opacity:1;transform:translate(-50%,0) scale(1)}100%{opacity:0;transform:translate(-50%,-5px) scale(1)}}
    .result-overlay{position:fixed;inset:0;z-index:95;display:grid;place-items:center;pointer-events:none;background:#f5f0ffcc}
    .result-overlay[hidden]{display:none!important}
    .result-overlay.show{animation:result-in 2200ms ease forwards}
    .result-card{min-width:230px;padding:28px 34px;border:2px solid #8b5cf6;border-radius:16px;background:#fff;text-align:center;box-shadow:0 0 40px #8b5cf633}
    .result-title{font-size:36px;font-weight:950;color:#8b5cf6}
    .result-subtitle{color:#9b8eab;font-size:13px;margin-top:8px}
    .result-overlay.loss .result-card{border-color:#f78da7;box-shadow:0 0 40px #f78da766}
    .result-overlay.loss .result-title{color:#f78da7}
    @keyframes result-in{0%{opacity:0;transform:scale(.88)}12%,78%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.04)}}
    .effect-layer{position:fixed;inset:0;pointer-events:none;z-index:20;display:grid;place-items:center}
    .skill-toast{padding:10px 16px;border:1px solid #c4b5fd;border-radius:20px;background:#fff;color:#5a4b6e;font-size:14px;font-weight:800;opacity:0;transform:translateY(12px) scale(.9)}
    .skill-toast.show{animation:toast-pop 900ms ease-out forwards}
    @keyframes toast-pop{0%{opacity:0;transform:translateY(12px) scale(.9)}20%,75%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-8px) scale(1.02)}}
    .screen-flash{position:fixed;inset:0;background:#8b5cf644;opacity:0;pointer-events:none}
    .screen-flash.show{animation:flash-hit 420ms ease-out}
    @keyframes flash-hit{0%,100%{opacity:0}18%{opacity:1}45%{opacity:.35}}
    .player.skill-hit{animation:board-shake 420ms ease-out}
    .player.skill-cast{animation:cast-pulse 520ms ease-out}
    .player.skill-shield{box-shadow:0 0 0 2px #a78bfa,0 0 24px #8b5cf6aa,inset 0 0 22px #8b5cf622}
    @keyframes board-shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-4px)}40%{transform:translateX(4px)}60%{transform:translateX(-2px)}80%{transform:translateX(2px)}}
    @keyframes cast-pulse{0%,100%{filter:none}45%{filter:brightness(1.3) saturate(1.2)}}
    .prediction{display:none;padding:1px 4px;border:1px solid #a78bfa;border-radius:4px;background:#f5f0ff;color:#7c3aed;font-size:8px;font-weight:700}
    .prediction.show{display:inline-block}
    .controls button.locked{background:#fde8e8;border-color:#f78da7;color:#e74c6f}
    .quality-gold{box-shadow:inset 0 0 0 1px #ffe675,0 0 9px #ffd84a88!important}
    .quality-weak{filter:saturate(.45)}
    .quality-discount{border-color:#55e5bb!important}
    .quality-overload{border-color:#ff7c92!important}
  </style>
</head>
<body><main class="app">
  <header><div><div class="eyebrow">mobile realtime prototype</div><h1>Skill Tetris</h1></div><div class="status" id="status">房间模式</div></header>
  <div class="online"><button class="primary" id="create-room">创建房间</button><input id="room-code" maxlength="5" placeholder="邀请码"><button id="join-room">加入</button><button id="ready-room">准备</button><button class="primary" id="start-room" hidden>开始比赛</button><span class="online-status" id="online-status">未连接</span><span class="action-feedback" id="action-feedback" role="status" aria-live="polite">点击按钮开始</span><div class="room-presence" id="room-presence"><span class="room-phase">房间模式</span><span class="room-players">请创建或加入房间</span></div></div>
  <div id="countdown" class="countdown-modal lobby-overlay" hidden><div class="countdown-label">比赛即将开始</div><div id="countdown-value" class="countdown-value">3</div></div>
  <section class="arena">
    <section class="player"><div class="player-head"><strong>玩家 1</strong><span id="prediction-a" class="prediction"></span><span id="score-a">0 pts</span></div><div class="board" id="board-a"></div><div class="controls" data-player="a"><button data-action="left">←</button><button data-action="rotate">↻</button><button data-action="right">→</button><button data-action="drop">↓</button><button class="wide" data-action="hard">硬降锁定</button></div><div class="meter"><div class="meter-line"><span>能量</span><span id="energy-a">0 / 100</span></div><div class="meter-bar"><div class="meter-fill" id="fill-a"></div></div></div><div class="skills" id="skills-a"><button class="skill fixed-skill" data-player="a" data-skill="cleanse">净化<small>清除负面 · 30</small></button><button class="skill fixed-skill" data-player="a" data-skill="unlockHardDrop">解锁硬降<small>本局永久 · 80</small></button><button class="draw-skill" data-player="a">抽技能<small>消耗 10</small></button><div class="skill-slots" id="skill-slots-a"></div></div></section>
    <section class="player"><div class="player-head"><strong>玩家 2</strong><span id="prediction-b" class="prediction"></span><span id="score-b">0 pts</span></div><div class="board" id="board-b"></div><div class="controls" data-player="b"><button data-action="left">←</button><button data-action="rotate">↻</button><button data-action="right">→</button><button data-action="drop">↓</button><button class="wide" data-action="hard">硬降锁定</button></div><div class="meter"><div class="meter-line"><span>能量</span><span id="energy-b">0 / 100</span></div><div class="meter-bar"><div class="meter-fill" id="fill-b"></div></div></div><div class="skills" id="skills-b"><button class="skill fixed-skill" data-player="b" data-skill="cleanse">净化<small>清除负面 · 30</small></button><button class="skill fixed-skill" data-player="b" data-skill="unlockHardDrop">解锁硬降<small>本局永久 · 80</small></button><button class="draw-skill" data-player="b">抽技能<small>消耗 10</small></button><div class="skill-slots" id="skill-slots-b"></div></div></section>
    <aside class="center"><div class="center-panel"><h2>对战记录</h2><div class="log" id="log"></div></div><div class="center-panel"><h2>房间提示</h2><div id="snapshot" class="tag">等待房间事件</div></div></aside>
  </section>
</main>
<div class="effect-layer" aria-hidden="true"><div id="skill-toast" class="skill-toast"></div></div><div id="screen-flash" class="screen-flash" aria-hidden="true"></div>
<div id="room-toast" class="room-toast" role="status" aria-live="polite"></div>
<div id="result" class="result-overlay" hidden><div class="result-card"><div class="result-title"></div><div class="result-subtitle">留在房间，准备下一局</div></div></div>
<div id="lobby-overlay" class="lobby-overlay"><div class="lobby-card"><h2 id="lobby-title">进入房间开始对战</h2><p id="lobby-message">创建房间或输入邀请码加入，双方准备后由房主开始比赛。</p></div></div>
<script src="game.js"></script><script src="client-network.js"></script><script type="text/plain">
const {Player,addGarbageLines}=HexGame;const players={a:new Player('Player 1','cyan'),b:new Player('Player 2','pink')};players.b.dropInterval=6000;const logEl=document.querySelector('#log');const log=m=>{const p=document.createElement('p');p.textContent=m;logEl.prepend(p)};const network=new MatchClient({onStatus:s=>document.querySelector('#online-status').textContent=s,onEvent:e=>{if(e.room){document.querySelector('#room-code').value=e.room.code;document.querySelector('#snapshot').textContent=`${e.room.status} · ${e.room.players.length}/2 players · seq ${e.room.seq}`};if(e.type==='command')log(`server command #${e.room.seq}: ${e.payload?.type||''}`);if(e.type==='error')log(`network error: ${e.code}`)}});const wsUrl=`${location.protocol==='https:'?'wss':'ws'}://${location.host}`;document.querySelector('#create-room').onclick=()=>{network.connect(wsUrl);network.create()};document.querySelector('#join-room').onclick=()=>{network.connect(wsUrl);network.join(document.querySelector('#room-code').value)};document.querySelector('#ready-room').onclick=()=>network.ready();
function paint(k){const p=players[k],cells=p.board.map(r=>r.slice());p.current.cells.forEach((r,dy)=>r.forEach((v,dx)=>{if(v&&p.y+dy>=0&&cells[p.y+dy])cells[p.y+dy][p.x+dx]=p.current.color}));document.querySelector('#board-'+k).innerHTML=cells.flat().map(v=>`<div class="cell ${v?'filled '+(v===8?'garbage':v):''}"></div>`).join('');document.querySelector('#score-'+k).textContent=`${p.score} pts`;document.querySelector('#energy-'+k).textContent=`${p.energy} / 100`;document.querySelector('#fill-'+k).style.width=`${p.energy}%`;document.querySelectorAll(`.skill[data-player="${k}"]`).forEach(b=>b.disabled=p.energy<({strike:20,shield:10}[b.dataset.skill])||!p.alive)}
function act(k,a){const p=players[k];if(!p.alive)return;if(a==='left')p.move(-1);if(a==='right')p.move(1);if(a==='rotate')p.rotate();if(a==='drop')p.softDrop();if(a==='hard')p.hardDrop();network.command({type:a==='left'||a==='right'?'move':a==='rotate'?'rotate':a==='drop'?'softDrop':'hardDrop',direction:a==='left'?-1:a==='right'?1:undefined});paint(k)}document.querySelectorAll('.controls button').forEach(b=>b.onclick=()=>act(b.parentElement.dataset.player,b.dataset.action));document.querySelectorAll('.skill').forEach(b=>b.onclick=()=>{const p=players[b.dataset.player],cost=b.dataset.skill==='strike'?20:10;if(p.energy<cost)return;p.energy-=cost;if(b.dataset.skill==='strike'){const o=b.dataset.player==='a'?players.b:players.a;o.board=addGarbageLines(o.board,2);log(`${p.name} used strike`)}else p.shield=true;network.command({type:'skill',skill:b.dataset.skill});paint('a');paint('b')});
let last=performance.now();function loop(now){const d=now-last;last=now;Object.entries(players).forEach(([k,p])=>{if(!p.alive)return;p.lastDrop+=d;if(p.lastDrop>p.dropInterval){p.lastDrop=0;if(!p.softDrop())p.lock();paint(k)}network.state({score:p.score,energy:p.energy,alive:p.alive,board:p.board})});requestAnimationFrame(loop)}paint('a');paint('b');log('本地练习已开始');requestAnimationFrame(loop);
</script><script src="app.js"></script></body></html>
