<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>Skill Tetris</title>
  <style>
    :root{--bg:#10131b;--panel:#171d29;--line:#2e3a50;--text:#f5f7fb;--muted:#9ba7ba;--cyan:#38d6e5;--pink:#ff5b8d}
    *{box-sizing:border-box}html,body{width:100%;min-height:100%;overflow:hidden}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,sans-serif;position:fixed;inset:0;touch-action:none;-webkit-tap-highlight-color:transparent}.app{max-width:700px;margin:auto;padding:14px 10px 28px;height:100%;display:flex;flex-direction:column}header{display:flex;justify-content:space-between;gap:12px;align-items:start;margin-bottom:12px}h1{font-size:27px;margin:0}.eyebrow{font-size:11px;letter-spacing:.16em;color:var(--cyan);text-transform:uppercase}.status{font-size:11px;color:var(--muted);text-align:right}.online{display:flex;flex-wrap:wrap;gap:6px;padding:9px;border:1px solid var(--line);background:var(--panel);margin-bottom:10px}.online input,.online button{min-height:36px;border:1px solid var(--line);background:#202a3b;color:var(--text);padding:7px 9px}.online input{width:100px;text-transform:uppercase}.online .primary{background:var(--cyan);color:#081218;font-weight:800}.online-status{color:var(--muted);font-size:11px;align-self:center}.arena{display:grid;grid-template-columns:1fr 1fr;gap:10px;flex:1;min-height:0}.player{background:var(--panel);border:1px solid var(--line);padding:9px;min-width:0;min-height:0}.player-head{display:flex;justify-content:space-between;margin-bottom:7px}.tag{font-size:12px;color:var(--muted)}.board{display:grid;grid-template-columns:repeat(10,1fr);aspect-ratio:1/2;border:2px solid #354157;background:#0b0e14;gap:1px;padding:3px}.cell{background:#111722;border-radius:2px}.cell.filled{box-shadow:inset 0 2px #ffffff44,0 0 6px #ffffff22}.cyan{background:#37d8e7}.yellow{background:#f5c84b}.purple{background:#b57cff}.orange{background:#ff9a4d}.blue{background:#5687ff}.green{background:#5ed387}.red{background:#ff647e}.garbage{background:#586273}.meter{margin-top:7px}.meter-line{display:flex;justify-content:space-between;color:var(--muted);font-size:11px}.meter-bar{height:7px;background:#0d1119;border:1px solid #293346}.meter-fill{height:100%;background:var(--cyan)}.controls{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:7px}.controls button{min-height:38px;background:#202a3b;color:var(--text);border:1px solid var(--line);font-size:17px;touch-action:manipulation}.controls .wide{grid-column:span 2;font-size:13px}.center{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:8px}.center-panel{background:var(--panel);border:1px solid var(--line);padding:9px}.center-panel h2{font-size:12px;color:var(--muted);margin:0 0 6px}.log{height:58px;overflow:auto;font-size:11px;color:var(--muted)}.log p{margin:0 0 4px}.skills{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:7px}.skill{min-height:48px;text-align:left;background:#202a3b;color:var(--text);border:1px solid var(--line);font-size:11px}.skill:disabled{opacity:.4}.skill small{display:block;color:var(--muted)}
    @media(min-width:600px){.app{padding-top:24px}.arena{grid-template-columns:1fr 1fr}.board{max-width:240px;margin:auto}}
    @media(max-width:599px){
      html,body{width:100%;height:100%;overflow:hidden}
      body{background:#0d1118;position:fixed;inset:0;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none}
      .app{height:100svh;height:100dvh;min-height:0;overflow:hidden;padding:6px 6px 8px;display:flex;flex-direction:column;gap:5px;max-width:none}

      .online{position:relative;z-index:40;flex:0 0 auto;display:grid;grid-template-columns:auto 1fr auto auto auto;gap:4px;margin:0;padding:4px;border-radius:4px;align-items:center;pointer-events:auto}
      .online button,.online input{position:relative;z-index:41;min-height:30px;height:30px;padding:3px 6px;font-size:11px;touch-action:none;pointer-events:auto}

      .controls .wide{grid-column:span 4;min-height:27px;height:27px;font-size:11px}

      #snapshot{font-size:9px;line-height:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
      #countdown{font-size:68px!important}
      #result{font-size:25px!important}
    }
    .effect-layer{position:fixed;inset:0;pointer-events:none;z-index:20;display:grid;place-items:center}
    .skill-toast{padding:12px 18px;border:1px solid #ffffff66;border-radius:999px;background:#101722eF;color:#fff;font-size:16px;font-weight:900;letter-spacing:.04em;opacity:0;transform:translateY(12px) scale(.9)}
    .skill-toast.show{animation:toast-pop 900ms ease-out forwards}
    .screen-flash{position:fixed;inset:0;background:#ff456655;opacity:0;pointer-events:none}
    .screen-flash.show{animation:flash-hit 420ms ease-out}
    .player.skill-hit{animation:board-shake 420ms ease-out}
    .player.skill-cast{animation:cast-pulse 520ms ease-out}
    .player.skill-shield{box-shadow:0 0 0 2px #62dfff,0 0 24px #38d6e5aa,inset 0 0 22px #38d6e522}
    @keyframes toast-pop{0%{opacity:0;transform:translateY(12px) scale(.9)}20%,75%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-8px) scale(1.02)}}
    @keyframes flash-hit{0%,100%{opacity:0}18%{opacity:1}45%{opacity:.35}}
    @keyframes board-shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px) rotate(-.5deg)}40%{transform:translateX(5px) rotate(.5deg)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
    @keyframes cast-pulse{0%,100%{filter:none}45%{filter:brightness(1.8) saturate(1.5)}}
    .skill{touch-action:manipulation}.skill.insufficient{opacity:.55;border-style:dashed}
    :root{--bg:#070a10;--panel:#121722;--panel-2:#1a2130;--line:#344056;--text:#f7f9fc;--muted:#8f9cb0;--cyan:#2bd9ef;--pink:#ff557a;--lime:#73e2a7;--amber:#ffcf5a}

    .lobby-overlay{position:fixed;inset:0;z-index:15;display:grid;place-items:center;padding:20px;background:#070a10e8;pointer-events:none}.lobby-overlay[hidden]{display:none!important}.lobby-card{width:min(92vw,430px);padding:24px 20px;border:1px solid #3c5878;border-radius:12px;background:#101a29;box-shadow:0 12px 40px #000b;text-align:center;pointer-events:none}.lobby-card h2{margin:0 0 8px;font-size:22px}.lobby-card p{margin:0;color:#aebbd0;line-height:1.5}.app.game-hidden .arena{visibility:hidden}.countdown-modal{display:none;place-items:center;flex-direction:column;gap:10px;z-index:100;pointer-events:none}.countdown-modal.visible{display:flex}.countdown-modal .countdown-label{font-size:16px;color:#b9c8d9}.countdown-modal .countdown-value{font-size:108px;line-height:1;color:var(--cyan);text-shadow:0 0 24px #2bd9efaa}.countdown-modal .countdown-value.go{color:var(--lime);text-shadow:0 0 24px #73e2a7aa}
    .room-presence{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:28px;padding:4px 8px;border:1px solid #38506b;border-radius:5px;background:#0b1421;color:#dbe7f6;font-size:12px;font-weight:800}.room-presence .room-phase{color:var(--cyan)}.room-presence .room-players{color:#b7c5d8;font-weight:650}.room-toast{position:fixed;top:74px;left:50%;z-index:80;max-width:min(88vw,420px);padding:11px 18px;border:1px solid #64e8f5;border-radius:10px;background:#0d1a28f2;color:#f7ffff;font-size:16px;font-weight:900;text-align:center;box-shadow:0 8px 30px #0009,0 0 20px #2bd9ef55;opacity:0;pointer-events:none;transform:translate(-50%,-12px) scale(.96)}.room-toast.show{animation:room-toast-pop 1800ms ease forwards}@keyframes room-toast-pop{0%{opacity:0;transform:translate(-50%,-12px) scale(.96)}12%,78%{opacity:1;transform:translate(-50%,0) scale(1)}100%{opacity:0;transform:translate(-50%,-5px) scale(1)}}
    .result-overlay{position:fixed;inset:0;z-index:95;display:grid;place-items:center;pointer-events:none;background:#05080bcc;opacity:0}.result-overlay[hidden]{display:none!important}.result-overlay.show{animation:result-in 2200ms ease forwards}.result-card{min-width:230px;padding:28px 34px;border:2px solid var(--cyan);border-radius:12px;background:#0d1724;text-align:center;box-shadow:0 0 40px #2bd9ef66}.result-title{font-size:42px;font-weight:950}.result-subtitle{margin-top:8px;color:#b8c7da;font-size:14px}.result-overlay.loss .result-card{border-color:var(--pink);box-shadow:0 0 40px #ff557a66}.result-overlay.loss .result-title{color:#ff8aa4}@keyframes result-in{0%{opacity:0;transform:scale(.88)}12%,78%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.04)}}
    body{background:#070a10;color:var(--text)}button,input{font:inherit;border-radius:6px;letter-spacing:0}button{transition:transform 80ms ease,filter 80ms ease,box-shadow 120ms ease,border-color 120ms ease}button.is-pressed,button:active{transform:translateY(2px) scale(.94);filter:brightness(1.35)}button.action-success{animation:button-success 420ms ease}button.action-denied{animation:button-denied 360ms ease}.online{background:#101621;border-color:#2d394d;box-shadow:0 3px 12px #0007}.online button{font-weight:750;border-color:#3b4a62}.online .primary{background:#24c8dd;border-color:#77edfa;color:#061116;box-shadow:inset 0 -3px #11889a}.online input{background:#090d14;border-color:#46546b;text-align:center;font-weight:800;color:#fff}.player{background:#10151f;border-color:#303c50;box-shadow:0 4px 16px #0008,inset 0 1px #ffffff0d}.player:nth-child(1){border-top:3px solid var(--cyan)}.player:nth-child(2){border-top:3px solid var(--pink)}.player:nth-child(1) .player-head strong{color:var(--cyan)}.player:nth-child(2) .player-head strong{color:var(--pink)}.board{border-color:#4b5870;background:#05070b;box-shadow:inset 0 0 18px #000,0 2px 10px #0008}.meter-bar{border:0;border-radius:5px;overflow:hidden;background:#05080d}.meter-fill{background:#30d8eb;box-shadow:0 0 9px #30d8eb}.controls button{background:#202a3a;border:1px solid #46556e;color:#fff;font-weight:900;box-shadow:inset 0 -3px #101722,0 2px 5px #0008}.controls button[data-action="rotate"]{color:var(--amber);border-color:#806d3c}.controls button[data-action="drop"]{color:var(--lime);border-color:#3d7658}.controls .wide{background:#be3d58;border-color:#ff718a;box-shadow:inset 0 -3px #702235,0 2px 5px #0008}.skill{position:relative;touch-action:manipulation;text-align:left;font-weight:850;border-width:1px;padding-left:7px;box-shadow:inset 0 -3px #0005,0 2px 5px #0008;overflow:hidden}.skill small{font-weight:600;opacity:.82}.skill[data-skill="jam"],.skill[data-skill="reverse"]{background:#351824;border-color:#a84964;color:#ffbdca}.skill[data-skill="shield"],.skill[data-skill="cleanse"]{background:#12312e;border-color:#368b78;color:#a5f4dc}.skill.insufficient{opacity:.52;filter:saturate(.45)}.skill:disabled{opacity:.28;filter:grayscale(1)}.center-panel{background:#0e141e;border-color:#293448}.log p:first-child{color:#fff;font-weight:750}@keyframes button-success{0%,100%{box-shadow:inset 0 -3px #0005,0 2px 5px #0008}45%{border-color:#fff;box-shadow:0 0 0 2px #fff,0 0 18px #57f1c5;filter:brightness(1.45)}}@keyframes button-denied{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px);border-color:#ff4768}50%{transform:translateX(4px);border-color:#ff4768}75%{transform:translateX(-2px);border-color:#ff4768}}
    .skill::after{position:absolute;right:5px;top:4px;padding:1px 4px;border-radius:3px;font-size:7px;line-height:10px;font-weight:900}.skill[data-skill="jam"]::after,.skill[data-skill="reverse"]::after,.skill[data-skill="swapShape"]::after,.skill[data-skill="slam"]::after{content:'攻击';background:#7c2840;color:#ffd5df}.skill[data-skill="cleanse"]::after,.skill[data-skill="reshape"]::after,.skill[data-skill="store"]::after,.skill[data-skill="predict"]::after,.skill[data-skill="reflect"]::after,.skill[data-skill="clearTop"]::after,.skill[data-skill="copyBoard"]::after{content:'防御';background:#176451;color:#c7ffed}
    .skills{grid-template-columns:1fr 1fr}.skills>.skill,.draw-skill{min-width:0}.draw-skill{min-height:48px;text-align:left;padding-left:7px;border:1px solid #66542c;background:#392f17;color:#ffe3a0;font-size:11px;font-weight:850;box-shadow:inset 0 -3px #0005,0 2px 5px #0008}.draw-skill small{display:block;color:#d7c18c;font-size:9px}.skill-slots{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}.skill-slot-empty,.skill-card-back{height:38px;border:1px dashed #34435a;border-radius:5px;background:#0b1018;color:#536078;font-size:9px}.skill-card-back{border-style:solid;background:#171c2a;border-color:#49516b;color:#909bb1;text-align:center}.skill-card-back small{display:block}.prediction{display:none;padding:1px 4px;border:1px solid #4d8c79;border-radius:4px;background:#0e2b25;color:#9ff7d3;font-size:8px;font-weight:800}.prediction.show{display:inline-block}
    @media(max-width:599px){.app{padding:3px 4px 4px;gap:3px}header{height:25px}.eyebrow{display:none}h1{font-size:16px}.status{padding:2px 5px;border:1px solid #2e3b50;border-radius:5px;background:#111824}.online{padding:3px;gap:3px}.online button,.online input{height:29px;min-height:29px}.room-presence{min-height:24px;padding:2px 6px;font-size:10px}.action-feedback{min-height:16px;padding:1px 6px}.player{padding:3px;border-radius:6px}.player-head{margin-bottom:1px}.board{max-height:calc(100dvh - 292px)}.controls{gap:3px;margin-top:3px}.controls button{height:36px;min-height:36px;border-radius:6px;font-size:18px}.controls .wide{height:24px;min-height:24px;font-size:10px}.meter{margin-top:2px}.skills{gap:3px;margin-top:2px}.skill,.draw-skill{height:31px;min-height:31px;border-radius:6px;padding:2px 4px;font-size:8px;line-height:10px}.skill small,.draw-skill small{font-size:7px;line-height:8px}.skill-slots{gap:3px}.skill-slot-empty,.skill-card-back{height:31px}.center{height:28px}.center-panel{padding:2px;border-radius:5px}.center-panel h2{display:none}.log{height:20px}.result-title{font-size:36px}}
    .cell.forbidden{box-shadow:inset 0 0 0 1px #ff416c88,inset 0 0 7px #ff315066}.cell.filled.forbidden{outline:1px solid #ff416c}
    .skills{grid-template-columns:repeat(3,minmax(0,1fr))}

<body><main class="app">
  <header><div><div class="eyebrow">mobile realtime prototype</div><h1>Skill Tetris</h1></div><div class="status" id="status">房间模式</div></header>
  <div class="online"><button class="primary" id="create-room">创建房间</button><input id="room-code" maxlength="5" placeholder="邀请码"><button id="join-room">加入</button><button id="ready-room">准备</button><button class="primary" id="start-room" hidden>开始比赛</button><span class="online-status" id="online-status">未连接</span><span class="action-feedback" id="action-feedback" role="status" aria-live="polite">点击按钮开始</span><div class="room-presence" id="room-presence"><span class="room-phase">房间模式</span><span class="room-players">请创建或加入房间</span></div></div>
  <div id="countdown" class="countdown-modal lobby-overlay" hidden><div class="countdown-label">比赛即将开始</div><div id="countdown-value" class="countdown-value">3</div></div>
  <section class="arena">
    <section class="player"><div class="player-head"><strong>玩家 1</strong><span id="prediction-a" class="prediction"></span><span id="score-a">0 pts</span></div><div class="board" id="board-a"></div><div class="controls" data-player="a"><button data-action="left">←</button><button data-action="rotate">↻</button><button data-action="right">→</button><button data-action="drop">↓</button><button class="wide" data-action="hard">硬降锁定</button></div><div class="meter"><div class="meter-line"><span>能量</span><span id="energy-a">0 / 100</span></div><div class="meter-bar"><div class="meter-fill" id="fill-a"></div></div></div><div class="skills" id="skills-a"><button class="skill fixed-skill" data-player="a" data-skill="cleanse">净化<small>清除负面 · 30</small></button><button class="skill fixed-skill" data-player="a" data-skill="unlockHardDrop">解锁硬降<small>本局永久 · 80</small></button><button class="draw-skill" data-player="a">抽技能<small>消耗 10</small></button><div class="skill-slots" id="skill-slots-a"></div></div></section>
    <section class="player"><div class="player-head"><strong>玩家 2</strong><span id="prediction-b" class="prediction"></span><span id="score-b">0 pts</span></div><div class="board" id="board-b"></div><div class="controls" data-player="b"><button data-action="left">←</button><button data-action="rotate">↻</button><button data-action="right">→</button><button data-action="drop">↓</button><button class="wide" data-action="hard">硬降锁定</button></div><div class="meter"><div class="meter-line"><span>能量</span><span id="energy-b">0 / 100</span></div><div class="meter-bar"><div class="meter-fill" id="fill-b"></div></div></div><div class="skills" id="skills-b"><button class="skill fixed-skill" data-player="b" data-skill="cleanse">净化<small>清除负面 · 30</small></button><button class="skill fixed-skill" data-player="b" data-skill="unlockHardDrop">解锁硬降<small>本局永久 · 80</small></button><button class="draw-skill" data-player="b">抽技能<small>消耗 10</small></button><div class="skill-slots" id="skill-slots-b"></div></div></section>
    <aside class="center"><div class="center-panel"><h2>对战记录</h2><div class="log" id="log"></div></div><div class="center-panel"><h2>房间提示</h2><div id="snapshot" class="tag">等待房间事件</div></div></aside>
  </section>
</main>
<div class="effect-layer" aria-hidden="true"><div id="skill-toast" class="skill-toast"></div></div><div id="screen-flash" class="screen-flash" aria-hidden="true"></div>
<div id="room-toast" class="room-toast" role="status" aria-live="polite"></div>
<div id="result" class="result-overlay" hidden><div class="result-card"><div class="result-title"></div><div class="result-subtitle">留在房间，准备下一局</div></div></div>
<div id="lobby-overlay" class="lobby-overlay"><div class="lobby-card"><h2 id="lobby-title">进入房间开始对战</h2><p id="lobby-message">创建房间或输入邀请码加入，双方准备后由房主开始比赛。</p></div></div>
<script src="game.js"></script><script src="client-network.js"></script><script type="text/plain">
const {Player,addGarbageLines}=HexGame;const players={a:new Player('Player 1','cyan'),b:new Player('Player 2','pink')};players.b.dropInterval=6000;const logEl=document.querySelector('#log');const log=m=>{const p=document.createElement('p');p.textContent=m;logEl.prepend(p)};const network=new MatchClient({onStatus:s=>document.querySelector('#online-status').textContent=s,onEvent:e=>{if(e.room){document.querySelector('#room-code').value=e.room.code;document.querySelector('#snapshot').textContent=`${e.room.status} · ${e.room.players.length}/2 players · seq ${e.room.seq}`};if(e.type==='command')log(`server command #${e.room.seq}: ${e.payload?.type||''}`);if(e.type==='error')log(`network error: ${e.code}`)}});const wsUrl=`${location.protocol==='https:'?'wss':'ws'}://${location.host}`;document.querySelector('#create-room').onclick=()=>{network.connect(wsUrl);network.create()};document.querySelector('#join-room').onclick=()=>{network.connect(wsUrl);network.join(document.querySelector('#room-code').value)};document.querySelector('#ready-room').onclick=()=>network.ready();
function paint(k){const p=players[k],cells=p.board.map(r=>r.slice());p.current.cells.forEach((r,dy)=>r.forEach((v,dx)=>{if(v&&p.y+dy>=0&&cells[p.y+dy])cells[p.y+dy][p.x+dx]=p.current.color}));document.querySelector('#board-'+k).innerHTML=cells.flat().map(v=>`<div class="cell ${v?'filled '+(v===8?'garbage':v):''}"></div>`).join('');document.querySelector('#score-'+k).textContent=`${p.score} pts`;document.querySelector('#energy-'+k).textContent=`${p.energy} / 100`;document.querySelector('#fill-'+k).style.width=`${p.energy}%`;document.querySelectorAll(`.skill[data-player="${k}"]`).forEach(b=>b.disabled=p.energy<({strike:20,shield:10}[b.dataset.skill])||!p.alive)}
function act(k,a){const p=players[k];if(!p.alive)return;if(a==='left')p.move(-1);if(a==='right')p.move(1);if(a==='rotate')p.rotate();if(a==='drop')p.softDrop();if(a==='hard')p.hardDrop();network.command({type:a==='left'||a==='right'?'move':a==='rotate'?'rotate':a==='drop'?'softDrop':'hardDrop',direction:a==='left'?-1:a==='right'?1:undefined});paint(k)}document.querySelectorAll('.controls button').forEach(b=>b.onclick=()=>act(b.parentElement.dataset.player,b.dataset.action));document.querySelectorAll('.skill').forEach(b=>b.onclick=()=>{const p=players[b.dataset.player],cost=b.dataset.skill==='strike'?20:10;if(p.energy<cost)return;p.energy-=cost;if(b.dataset.skill==='strike'){const o=b.dataset.player==='a'?players.b:players.a;o.board=addGarbageLines(o.board,2);log(`${p.name} used strike`)}else p.shield=true;network.command({type:'skill',skill:b.dataset.skill});paint('a');paint('b')});
let last=performance.now();function loop(now){const d=now-last;last=now;Object.entries(players).forEach(([k,p])=>{if(!p.alive)return;p.lastDrop+=d;if(p.lastDrop>p.dropInterval){p.lastDrop=0;if(!p.softDrop())p.lock();paint(k)}network.state({score:p.score,energy:p.energy,alive:p.alive,board:p.board})});requestAnimationFrame(loop)}paint('a');paint('b');log('本地练习已开始');requestAnimationFrame(loop);
</script><script src="app.js"></script></body></html>
