<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Skill Tetris</title>
  <style>
    :root{--bg:#10131b;--panel:#171d29;--line:#2e3a50;--text:#f5f7fb;--muted:#9ba7ba;--cyan:#38d6e5;--pink:#ff5b8d}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,sans-serif}.app{max-width:700px;margin:auto;padding:14px 10px 28px}header{display:flex;justify-content:space-between;gap:12px;align-items:start;margin-bottom:12px}h1{font-size:27px;margin:0}.eyebrow{font-size:11px;letter-spacing:.16em;color:var(--cyan);text-transform:uppercase}.status{font-size:11px;color:var(--muted);text-align:right}.online{display:flex;flex-wrap:wrap;gap:6px;padding:9px;border:1px solid var(--line);background:var(--panel);margin-bottom:10px}.online input,.online button{min-height:36px;border:1px solid var(--line);background:#202a3b;color:var(--text);padding:7px 9px}.online input{width:100px;text-transform:uppercase}.online .primary{background:var(--cyan);color:#081218;font-weight:800}.online-status{color:var(--muted);font-size:11px;align-self:center}.arena{display:grid;grid-template-columns:1fr 1fr;gap:10px}.player{background:var(--panel);border:1px solid var(--line);padding:9px}.player-head{display:flex;justify-content:space-between;margin-bottom:7px}.tag{font-size:12px;color:var(--muted)}.board{display:grid;grid-template-columns:repeat(10,1fr);aspect-ratio:1/2;border:2px solid #354157;background:#0b0e14;gap:1px;padding:3px}.cell{background:#111722;border-radius:2px}.cell.filled{box-shadow:inset 0 2px #ffffff44,0 0 6px #ffffff22}.cyan{background:#37d8e7}.yellow{background:#f5c84b}.purple{background:#b57cff}.orange{background:#ff9a4d}.blue{background:#5687ff}.green{background:#5ed387}.red{background:#ff647e}.garbage{background:#586273}.meter{margin-top:7px}.meter-line{display:flex;justify-content:space-between;color:var(--muted);font-size:11px}.meter-bar{height:7px;background:#0d1119;border:1px solid #293346}.meter-fill{height:100%;background:var(--cyan)}.controls{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:7px}.controls button{min-height:38px;background:#202a3b;color:var(--text);border:1px solid var(--line);font-size:17px;touch-action:manipulation}.controls .wide{grid-column:span 2;font-size:13px}.center{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:8px}.center-panel{background:var(--panel);border:1px solid var(--line);padding:9px}.center-panel h2{font-size:12px;color:var(--muted);margin:0 0 6px}.log{height:58px;overflow:auto;font-size:11px;color:var(--muted)}.log p{margin:0 0 4px}.skills{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:7px}.skill{min-height:48px;text-align:left;background:#202a3b;color:var(--text);border:1px solid var(--line);font-size:11px}.skill:disabled{opacity:.4}.skill small{display:block;color:var(--muted)}
    @media(min-width:600px){.app{padding-top:24px}.arena{grid-template-columns:1fr 1fr}.board{max-width:240px;margin:auto}}
    @media(max-width:599px){
      html,body{width:100%;height:100%;overflow:hidden}
      body{background:#0d1118}
      .app{height:100dvh;min-height:0;overflow:hidden;padding:6px 6px 8px;display:flex;flex-direction:column;gap:5px}
      header{flex:0 0 auto;align-items:center;margin:0;height:31px;gap:6px}
      .eyebrow{font-size:8px;letter-spacing:.1em;line-height:1}
      h1{font-size:18px;line-height:1.1}
      .status{font-size:9px;max-width:145px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
      .online{flex:0 0 auto;display:grid;grid-template-columns:auto 1fr auto auto auto;gap:4px;margin:0;padding:4px;border-radius:4px;align-items:center}
      .online button,.online input{min-height:30px;height:30px;padding:3px 6px;font-size:11px}
      .online input{width:auto;min-width:0}
      .online-status{grid-column:1/-1;font-size:9px;line-height:11px;min-height:11px}
      .arena{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:minmax(0,1fr) auto;gap:5px;overflow:hidden}
      .player{min-width:0;min-height:0;padding:5px;border-radius:4px;display:flex;flex-direction:column;overflow:hidden}
      .player-head{flex:0 0 auto;margin-bottom:3px;font-size:11px}
      .player-head strong{font-size:11px}.player-head span{font-size:10px}
      .board{width:100%;height:auto;max-height:calc(100dvh - 245px);aspect-ratio:1/1.85;flex:0 1 auto;margin:0 auto;border-width:1px;padding:2px;gap:1px}
      .controls{flex:0 0 auto;grid-template-columns:repeat(4,1fr);gap:3px;margin-top:4px}
      .controls button{min-height:32px;height:32px;font-size:16px;border-radius:4px;padding:0}
      .controls .wide{grid-column:span 4;min-height:27px;height:27px;font-size:11px}
      .meter{flex:0 0 auto;margin-top:4px}.meter-line{font-size:9px;line-height:12px}.meter-bar{height:5px}
      .skills{flex:0 0 auto;grid-template-columns:1fr 1fr;gap:3px;margin-top:4px}
      .skill{min-height:35px;height:35px;padding:2px 3px;font-size:9px;border-radius:4px;line-height:12px}
      .skill small{font-size:8px;line-height:9px}
      .center{grid-column:1/-1;min-height:0;height:40px;display:grid;grid-template-columns:1fr 1fr;gap:4px;overflow:hidden}
      .center-panel{min-width:0;padding:4px;border-radius:4px;overflow:hidden}
      .center-panel h2{font-size:8px;line-height:10px;margin:0 0 2px}
      .log{height:20px;font-size:8px;line-height:10px}.log p{margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
      #snapshot{font-size:9px;line-height:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
      #countdown{font-size:68px!important}
      #result{font-size:25px!important}
    }
    .effect-layer{position:fixed;inset:0;pointer-events:none;z-index:20;display:grid;place-items:center}
    .skill-toast{padding:12px 18px;border:1px solid #ffffff66;border-radius:999px;background:#101722eF;color:#fff;font-size:16px;font-weight:900;letter-spacing:.04em;opacity:0;transform:translateY(12px) scale(.9)}
    .skill-toast.show{animation:toast-pop 900ms ease-out forwards}
    .screen-flash{position:fixed;inset:0;background:#ff456655;opacity:0}
    .screen-flash.show{animation:flash-hit 420ms ease-out}
    .player.skill-hit{animation:board-shake 420ms ease-out}
    .player.skill-cast{animation:cast-pulse 520ms ease-out}
    .player.skill-shield{box-shadow:0 0 0 2px #62dfff,0 0 24px #38d6e5aa,inset 0 0 22px #38d6e522}
    @keyframes toast-pop{0%{opacity:0;transform:translateY(12px) scale(.9)}20%,75%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-8px) scale(1.02)}}
    @keyframes flash-hit{0%,100%{opacity:0}18%{opacity:1}45%{opacity:.35}}
    @keyframes board-shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px) rotate(-.5deg)}40%{transform:translateX(5px) rotate(.5deg)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
    @keyframes cast-pulse{0%,100%{filter:none}45%{filter:brightness(1.8) saturate(1.5)}}
  </style>
</head>
<body><main class="app">
  <header><div><div class="eyebrow">mobile realtime prototype</div><h1>Skill Tetris</h1></div><div class="status" id="status">Practice mode</div></header>
  <div class="online"><button class="primary" id="create-room">创建房间</button><input id="room-code" maxlength="5" placeholder="邀请码"><button id="join-room">加入</button><button id="ready-room">准备</button><button class="primary" id="start-room" hidden>开始比赛</button><span class="online-status" id="online-status">未连接</span></div>
  <div id="countdown" hidden style="position:fixed;inset:0;z-index:9999;display:none;place-items:center;background:#080b11ee;font-size:96px;font-weight:900;color:#38d6e5;text-shadow:0 0 20px #38d6e5;pointer-events:none"></div>
  <section class="arena">
    <section class="player"><div class="player-head"><strong>玩家 1</strong><span id="score-a">0 pts</span></div><div class="board" id="board-a"></div><div class="controls" data-player="a"><button data-action="left">←</button><button data-action="rotate">↻</button><button data-action="right">→</button><button data-action="drop">↓</button><button class="wide" data-action="hard">硬降</button></div><div class="meter"><div class="meter-line"><span>能量</span><span id="energy-a">0 / 100</span></div><div class="meter-bar"><div class="meter-fill" id="fill-a"></div></div></div><div class="skills"><button class="skill" data-player="a" data-skill="strike">电弧轰击<small>消耗 20</small></button><button class="skill" data-player="a" data-skill="shield">棱镜护盾<small>消耗 10</small></button></div></section>
    <section class="player"><div class="player-head"><strong>玩家 2</strong><span id="score-b">0 pts</span></div><div class="board" id="board-b"></div><div class="controls" data-player="b"><button data-action="left">←</button><button data-action="rotate">↻</button><button data-action="right">→</button><button data-action="drop">↓</button><button class="wide" data-action="hard">硬降</button></div><div class="meter"><div class="meter-line"><span>能量</span><span id="energy-b">0 / 100</span></div><div class="meter-bar"><div class="meter-fill" id="fill-b"></div></div></div><div class="skills"><button class="skill" data-player="b" data-skill="strike">电弧轰击<small>消耗 20</small></button><button class="skill" data-player="b" data-skill="shield">棱镜护盾<small>消耗 10</small></button></div></section>
    <aside class="center"><div class="center-panel"><h2>对战记录</h2><div class="log" id="log"></div></div><div class="center-panel"><h2>连接快照</h2><div id="snapshot" class="tag">等待房间事件</div></div></aside>
  </section>
</main>
<div class="effect-layer" aria-hidden="true"><div id="skill-toast" class="skill-toast"></div></div><div id="screen-flash" class="screen-flash" aria-hidden="true"></div>
<script src="game.js"></script><script src="client-network.js"></script><script type="text/plain">
const {Player,addGarbageLines}=HexGame;const players={a:new Player('Player 1','cyan'),b:new Player('Player 2','pink')};players.b.dropInterval=6000;const logEl=document.querySelector('#log');const log=m=>{const p=document.createElement('p');p.textContent=m;logEl.prepend(p)};const network=new MatchClient({onStatus:s=>document.querySelector('#online-status').textContent=s,onEvent:e=>{if(e.room){document.querySelector('#room-code').value=e.room.code;document.querySelector('#snapshot').textContent=`${e.room.status} · ${e.room.players.length}/2 players · seq ${e.room.seq}`};if(e.type==='command')log(`server command #${e.room.seq}: ${e.payload?.type||''}`);if(e.type==='error')log(`network error: ${e.code}`)}});const wsUrl=`${location.protocol==='https:'?'wss':'ws'}://${location.host}`;document.querySelector('#create-room').onclick=()=>{network.connect(wsUrl);network.create()};document.querySelector('#join-room').onclick=()=>{network.connect(wsUrl);network.join(document.querySelector('#room-code').value)};document.querySelector('#ready-room').onclick=()=>network.ready();
function paint(k){const p=players[k],cells=p.board.map(r=>r.slice());p.current.cells.forEach((r,dy)=>r.forEach((v,dx)=>{if(v&&p.y+dy>=0&&cells[p.y+dy])cells[p.y+dy][p.x+dx]=p.current.color}));document.querySelector('#board-'+k).innerHTML=cells.flat().map(v=>`<div class="cell ${v?'filled '+(v===8?'garbage':v):''}"></div>`).join('');document.querySelector('#score-'+k).textContent=`${p.score} pts`;document.querySelector('#energy-'+k).textContent=`${p.energy} / 100`;document.querySelector('#fill-'+k).style.width=`${p.energy}%`;document.querySelectorAll(`.skill[data-player="${k}"]`).forEach(b=>b.disabled=p.energy<({strike:20,shield:10}[b.dataset.skill])||!p.alive)}
function act(k,a){const p=players[k];if(!p.alive)return;if(a==='left')p.move(-1);if(a==='right')p.move(1);if(a==='rotate')p.rotate();if(a==='drop')p.softDrop();if(a==='hard')p.hardDrop();network.command({type:a==='left'||a==='right'?'move':a==='rotate'?'rotate':a==='drop'?'softDrop':'hardDrop',direction:a==='left'?-1:a==='right'?1:undefined});paint(k)}document.querySelectorAll('.controls button').forEach(b=>b.onclick=()=>act(b.parentElement.dataset.player,b.dataset.action));document.querySelectorAll('.skill').forEach(b=>b.onclick=()=>{const p=players[b.dataset.player],cost=b.dataset.skill==='strike'?20:10;if(p.energy<cost)return;p.energy-=cost;if(b.dataset.skill==='strike'){const o=b.dataset.player==='a'?players.b:players.a;o.board=addGarbageLines(o.board,2);log(`${p.name} used strike`)}else p.shield=true;network.command({type:'skill',skill:b.dataset.skill});paint('a');paint('b')});
let last=performance.now();function loop(now){const d=now-last;last=now;Object.entries(players).forEach(([k,p])=>{if(!p.alive)return;p.lastDrop+=d;if(p.lastDrop>p.dropInterval){p.lastDrop=0;if(!p.softDrop())p.lock();paint(k)}network.state({score:p.score,energy:p.energy,alive:p.alive,board:p.board})});requestAnimationFrame(loop)}paint('a');paint('b');log('本地练习已开始');requestAnimationFrame(loop);
</script><script src="app.js"></script></body></html>
